name: Daily SEO Post

on:
  schedule:
    - cron: '0 8 * * 2,4,6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests Pillow

      - name: Install fonts for image branding
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation

      - name: Configure git for automated commits
        run: |
          git config user.email "seoautopilot@ndca"
          git config user.name "SEO Autopilot"
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}

      - name: Write config from secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WP_PASSWORD: ${{ secrets.WP_PASSWORD }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
        run: |
          python3 - <<'EOF'
          import json, os
          with open("config.json") as f:
              cfg = json.load(f)
          cfg["anthropic_api_key"] = os.environ["ANTHROPIC_API_KEY"]
          cfg["wordpress_password"] = os.environ["WP_PASSWORD"]
          cfg["pexels_api_key"] = os.environ["PEXELS_KEY"]
          with open("config.json", "w") as f:
              json.dump(cfg, f, indent=2)
          print("Config updated from secrets.")
          EOF

      - name: Run SEO Autopilot
        run: python3 seo_autopilot.py

      - name: Save published log back to repo
        run: |
          git add published.json
          git diff --staged --quiet || git commit -m "Log: post $(date +'%Y-%m-%d')"
          git push
